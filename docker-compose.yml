services:

  mysql:
    image: mysql:8.4
    container_name: linuxops-mysql

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    restart: unless-stopped


  linuxops-api:
    build: .
    container_name: linuxops-api

    depends_on:
      - mysql

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/linuxops_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    expose:
      - "8080"

    restart: unless-stopped


  linuxops-frontend:
    build: ./frontend
    container_name: linuxops-frontend

    expose:
      - "80"

    depends_on:
      - linuxops-api

    restart: unless-stopped


  nginx:
    image: nginx:alpine
    container_name: linuxops-nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - linuxops-frontend
      - linuxops-api

    restart: unless-stopped


volumes:
  mysql_data: